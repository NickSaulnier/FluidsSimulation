[meta]
name = "Mercury rain"
energy = "any"

[sim]
solver = "PBF"
scene = "Tank with obstacle"
palette = "Mercury"
reactions = [
    { trigger = "kick", effect = "splash", gain = 1.4 },
    { trigger = "bass", effect = "slosh", gain = 0.5 },
    { trigger = "hat", effect = "flash", gain = 0.8 },
    { trigger = "snare", effect = "vortex", gain = 0.5 },
]

[feedback]
mode = "smear"
trail = 0.4
echo = 0.2
echo_zoom = 1.25
echo_flip = "horizontal"

[waves]
mode = "xy"
scale = 1.2
brightness = 1.4
