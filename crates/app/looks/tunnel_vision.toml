[meta]
name = "Tunnel vision"
tags = ["no fluid", "tunnel", "circle"]
energy = "energetic"

[sim]
palette = "Ocean"
reactions = [
    { trigger = "kick", effect = "flash", gain = 0.8 },
    { trigger = "brightness", effect = "hue", gain = 0.5 },
]

[feedback]
mode = "brightest"
trail = 0.65
zoom = 1.6
rotation = 0.3
bass_zoom = 0.5

[waves]
mode = "circle"
size = 0.2
scale = 0.9
brightness = 0.7

[composite]
hue_speed = 10.0
vignette = 0.5

[code]
# The tunnel leans with the music: its centre wanders, faster with the bass.
init = "phase = 0"
frame = """
phase = phase + dt * (0.4 + bass_att)
cx = 0.5 + 0.08 * sin(phase * 0.7)
cy = 0.5 + 0.08 * cos(phase * 0.5)
rot = rot + 0.4 * beat
"""
