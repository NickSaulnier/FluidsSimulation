# A look: what the fluid is, how the picture carries over from frame to frame, what's
# drawn from the sound, and equations that drive it all with the music. See
# crates/app/looks/README.md for every setting and name.

[meta]
name = "Ocean pulse"
energy = "any"

[sim]
solver = "FLIP"
scene = "Tank with obstacle"
palette = "Ocean"
liquid = true
reactions = [
    { trigger = "kick", effect = "splash", gain = 1.2 },
    { trigger = "bass", effect = "slosh", gain = 0.8 },
    { trigger = "snare", effect = "vortex", gain = 0.6 },
    { trigger = "hat", effect = "flash", gain = 0.5 },
    { trigger = "brightness", effect = "hue", gain = 0.3 },
]

[feedback]
mode = "smear"
trail = 0.5
flow = 1.0

[waves]
mode = "line"
y = 0.55
scale = 0.6
brightness = 1.2
