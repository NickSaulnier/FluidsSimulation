[meta]
name = "Crossfire"
tags = ["fluid", "dye", "jets"]
energy = "energetic"

[sim]
solver = "Stable fluids (GPU)"
scene = "Two jets"
palette = "Neon"
params = { vorticity = 0.7, dissipation = 0.02 }
reactions = [
    { trigger = "snare", effect = "vortex", gain = 0.7 },
    { trigger = "kick", effect = "flash", gain = 0.5 },
    { trigger = "brightness", effect = "hue", gain = 0.4 },
]

[feedback]
mode = "brightest"
trail = 0.45
flow = 1.2

[composite]
vignette = 0.3
