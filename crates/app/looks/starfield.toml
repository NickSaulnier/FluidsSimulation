[meta]
name = "Starfield"
tags = ["no fluid", "tunnel", "spectrum"]
energy = "energetic"

[sim]
palette = "Ocean"
reactions = [
    { trigger = "kick", effect = "flash", gain = 1.0 },
    { trigger = "hat", effect = "flash", gain = 0.4 },
]

[feedback]
mode = "brightest"
trail = 0.6
zoom = 2.0
bass_zoom = 0.6

[waves]
mode = "mirror_spectrum"
size = 0.05
brightness = 0.7

[composite]
contrast = 1.3
aberration = 0.012
grain = 0.04

[code]
# Faster toward the edges, like flying through stars; a kick is a jump.
frame = """
zoom = zoom + 1.5 * kick
"""
pixel = """
zoom = 1 + (zoom - 1) * (0.4 + 1.4 * rad)
"""
