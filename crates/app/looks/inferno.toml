[meta]
name = "Inferno"
energy = "energetic"

[sim]
solver = "Fire (3D GPU)"
scene = "Torch"
palette = "Lava"
orbit = 0.25
params = { vorticity = 0.8 }
reactions = [
    { trigger = "kick", effect = "jet", gain = 1.4 },
    { trigger = "snare", effect = "vortex", gain = 1.2 },
    { trigger = "bass", effect = "slosh", gain = 0.5 },
    { trigger = "hat", effect = "param", param = "flicker", gain = 0.8 },
    { trigger = "mid", effect = "gust", gain = 0.5 },
]

[feedback]
mode = "brightest"
trail = 0.55
zoom = 1.15
rotation = 0.25
warp = 0.006
bass_zoom = 0.5

[waves]
mode = "circle"
size = 0.3
scale = 0.8
brightness = 1.3

[composite]
symmetry = "kaleidoscope"
segments = 6
symmetry_spin = 0.1
vignette = 0.4

[code]
# The outer rings turn faster than the middle, twisting the tunnel into a spiral; each
# beat gives it a push of zoom.
frame = """
zoom = zoom + 0.25 * beat
"""
pixel = """
rot = rot * (0.4 + 1.2 * rad)
"""
