[meta]
name = "Heartbeat"
tags = ["no fluid", "oscilloscope", "line"]
energy = "calm"

[sim]
palette = "Slime"
reactions = [
    { trigger = "kick", effect = "flash", gain = 0.5 },
]

[feedback]
mode = "brightest"
trail = 0.9
drift = [-0.35, 0.0]

[waves]
mode = "line"
y = 0.0
scale = 0.9
brightness = 1.6
thickness = 2.5

[composite]
contrast = 1.2
vignette = 0.5
grain = 0.05

[code]
# The trace runs left like a monitor's, faster with the tempo.
frame = """
dx = -0.25 - 0.002 * bpm * beating
wave_brightness = 1.2 + 1.2 * kick
"""
