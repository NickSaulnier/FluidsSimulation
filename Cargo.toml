[workspace]
resolver = "3"
members = ["crates/sim", "crates/sim-gpu", "crates/app", "crates/bench"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"
publish = false

# Graphics/UI crates are pinned exactly: wgpu ships a breaking major roughly every
# quarter, and egui-wgpu / egui-winit must match the wgpu / winit majors below.
# Everything else is pinned by Cargo.lock.
[workspace.dependencies]
sim        = { path = "crates/sim" }
sim-gpu    = { path = "crates/sim-gpu" }
wgpu       = "=30.0.1"
winit      = "=0.30.13"
egui       = "=0.36.2"
egui-wgpu  = "=0.36.2"
egui-winit = "=0.36.2"
egui-phosphor = "=0.14.0"
rodio      = "=0.22.2"
rustfft    = "6"
rayon      = "1.12"
glam       = { version = "0.34", features = ["bytemuck"] }
bytemuck   = { version = "1", features = ["derive"] }
pollster   = "0.4"
anyhow     = "1"
thiserror  = "2"
clap       = { version = "4", features = ["derive"] }
log        = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"

# Dev builds: our code lightly optimized, all dependencies fully optimized.
# Without this a debug-build fluid sim is 10-50x slower.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
# The solvers are the hot path; at opt-level 1 the app drops to ~25 fps with FLIP.
# Comment this out when you want to step through solver code in a debugger.
[profile.dev.package.sim]
opt-level = 3

[profile.release]
debug = "line-tables-only"
